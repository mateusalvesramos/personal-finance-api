spring:
  application:
    name: personal-finance-api
  datasource:
    url: jdbc:mysql://localhost:3306/finance?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true